apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  blocks:
    - start: 192.168.2.100
      stop: 192.168.2.100
    - start: 192.168.2.150
      stop: 192.168.2.150
    - start: 192.168.2.50
      stop: 192.168.2.50
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  interfaces:
    - ^eno1$
  loadBalancerIPs: true
