# https://longhorn.io/docs/1.12.0/deploy/install/
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  releaseName: longhorn
  targetNamespace: longhorn-system
  storageNamespace: longhorn-system
  dependsOn:
    - name: cilium
  chart:
    spec:
      chart: longhorn
      version: v1.12.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    preUpgradeChecker:
      jobEnabled: false
