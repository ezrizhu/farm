apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 10s
  path: ./manifests-infra/ingress
  prune: true
  wait: true
  dependsOn:
    - name: cilium-ip
  sourceRef:
    kind: GitRepository
    name: flux-system
